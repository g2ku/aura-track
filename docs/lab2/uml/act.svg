order="stroke">[нет]</text><rect x="642.0" y="277.0" width="200.0" height="46.0" rx="16" fill="#ffffff" stroke="#0f6b57" stroke-width="1.3"/><text x="742.0" y="297.0" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#15171b">Ответ</text><text x="742.0" y="313.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a9099">цифра + опора к прошлой неделе</text><path d="M642.0,300.0 L596.0,300.0" fill="none" stroke="#4b5160" stroke-width="1.3" marker-end="url(#act-s)"/><rect x="376.0" y="277.0" width="220.0" height="46.0" rx="16" fill="#ffffff" stroke="#0f6b57" stroke-width="1.3"/><text x="486.0" y="297.0" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#15171b">Подсказки</text><text x="486.0" y="313.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a9099">что спросить дальше · память</text><path d="M376.0,300.0 L330.0,300.0" fill="none" stroke="#4b5160" stroke-width="1.3" marker-end="url(#act-s)"/><circle cx="318" cy="300" r="11" fill="#ffffff" stroke="#15171b" stroke-width="1.4"/><circle cx="318" cy="300" r="6.5" fill="#15171b"/><text x="486.0" y="344.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a9099">непонятый вопрос, за которым сразу пришёл понятный, запоминается как исправление</text></svg>