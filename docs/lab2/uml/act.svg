<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" role="img" aria-label="Деятельность: ассистент разбирает вопрос правилами и отвечает цифрой с опорой" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif"><defs><marker id="act-s" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker><marker id="act-o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4b5160" stroke-width="1.4"/></marker><marker id="act-g" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#4b5160" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="960" height="372" fill="#ffffff"/><circle cx="24" cy="70" r="9" fill="#15171b"/><rect x="46.0" y="47.0" width="144.0" height="46.0" rx="16" fill="#ffffff" stroke="#0f6b57" stroke-width="1.3"/><text x="118.0" y="67.0" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#15171b">Вопрос</text><text x="118.0" y="83.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a9099">текст или голос</text><path d="M250,44 L290,70 L250,96 L210,70 z" fill="#f6f7f9" stroke="#4b5160" stroke-width="1.2"/><text x="250.0" y="74.0" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#15171b">реплика?</text><rect x="330.0" y="47.0" width="160.0" height="46.0" rx="16" fill="#ffffff" stroke="#0f6b57" stroke-width="1.3"/><text x="410.0" y="67.0" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#15171b