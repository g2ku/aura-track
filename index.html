<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16130e" />
    <title>Aura · Кофе | пульт сети</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Добавление на домашний экран. iOS манифест почти не читает и берёт
         apple-touch-icon и свои meta, поэтому они прописаны отдельно —
         сайт смотрят в основном с айфона. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura 02" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Иконочный шрифт — своё подмножество: 130 нужных глифов вместо
         840 КБ полного Tabler с CDN. Собирается scripts/icons-subset.mjs,
         имена с хэшем — кэшируются вечно. Стиль блокирующий намеренно:
         он крошечный и с нашего домена, зато иконки не мигают. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/tabler-icons.ccb70c46.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/tabler-icons.01255f31.css" />
    <!-- Прогреваем соединение к Firebase заранее — приложение не рендерит
         контент, пока не получит ответ Auth/Firestore после загрузки JS. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
  </head>
  <body>
    <!--
    DIRECTION CONTRACT — «Термолента» (thermal receipt strip).
    THESIS: сеть кофейни читается как стопка термолент — касса, долги и статусы
    видны строчками чека, без карточек-метрик и дашбордных героев.
    OWN-WORLD: бумага и чернила (светлая «бумага» / тёмная «ночная смена»);
    пунктирные разделители, точечные лидеры «название … сумма», моноширинные
    суммы, жирный ИТОГО, колпачковые микро-заголовки с разрядкой; единственный
    цветной слой — синька-копирка (акцент) и функциональные чернила статусов;
    глубина только границей, тени — лишь у модалок и тостов.
    STORY: владелец открывает телефон, видит кассу каждой точки строкой чека и
    штамп состояния, «то-сё» — в мини-блоках; любое действие в 1–2 нажатия.
    FIRST VIEWPORT: верх — шапка чека «КАССА · {дата}»; лента точек: название +
    штамп статуса, строка ИТОГО, затем точечные строки (чеки, средний чек,
    долг); блок «ТРЕБУЕТ ВНИМАНИЯ»; мини-блоки «ТО-СЁ» сеткой пунктирных ячеек;
    низ — подвал чека с навигацией.
    FORM: мир «Термолента», assigned индексом 3 ролла concept-seed,
    seed key 4b60e369; поднят дисциплинами: пометки-«вычеркивания»
    (doujin catalog), «одна надпись на вещь» (saville catalog), «все сигналы
    одной строчкой» (oscilloscope bench).
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
